# Local development database. Start with: docker compose up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: spaceship
      POSTGRES_PASSWORD: spaceship
      POSTGRES_DB: spaceship
    ports:
      - "5432:5432"
    volumes:
      - spaceship_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spaceship -d spaceship"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  spaceship_pgdata:
